[package]
name = "rgw-integrity"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
description = "Find and classify what known Ceph RGW races leave behind"
repository = "https://github.com/mmgaggle/rgw-integrity"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
libc = "0.2.189"
maud = { version = "0.27.0", features = ["axum"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "form", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled", "load_extension"] }
rustls = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[features]
default = ["ceph"]
# link librados and use the cluster; without it, only the server's local
# SQLite mode and the offline tests work
ceph = []

[profile.release]
debug = 1
